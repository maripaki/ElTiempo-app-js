<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi App del Tiempo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding-top: 50px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        input, button {
            padding: 10px;
            font-size: 16px;
            margin: 5px;
        }
        #resultado {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Consulta el Tiempo</h2>
        <!-- Input donde escribiremos la ciudad -->
        <input type="text" id="ciudadInput" placeholder="Ej: Sevilla, ES">
        <!-- Botón que lanzará la búsqueda -->
        <button id="btnBuscar">Buscar</button>

        <!-- Zona donde aparecerán los datos del clima -->
        <div id="resultado"></div>
    </div>
    
 <script src="scripts.js"></script>
</body>
</html>
